<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Tank 1990</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05010f;--cy:#00ffe1;--mg:#ff2bd6;--ye:#ffe600;--tx:#d9f7ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;touch-action:none}
#app canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:center;gap:clamp(10px,3vw,28px);font-weight:700;font-size:clamp(12px,3.2vw,17px);text-shadow:0 0 8px var(--cy);pointer-events:none;flex-wrap:wrap;padding:0 8px}
#hud b{color:var(--ye);text-shadow:0 0 8px var(--ye)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,1,15,.72);padding:20px;cursor:pointer}
#ov.h{display:none}
#ot{font-size:clamp(32px,9vw,72px);margin:0 0 12px;color:var(--cy);text-shadow:0 0 10px var(--cy),0 0 30px var(--mg);letter-spacing:.04em}
#op{font-size:clamp(14px,3.6vw,19px);line-height:1.6;max-width:30em;margin:0;text-shadow:0 0 6px var(--mg)}
#tc{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
@media(pointer:coarse){#tc{display:flex}}
#js{position:relative;width:128px;height:128px;border-radius:50%;border:2px solid var(--cy);background:rgba(0,255,225,.08);box-shadow:0 0 12px rgba(0,255,225,.45);pointer-events:auto;touch-action:none}
#jk{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,255,225,.35);border:2px solid var(--cy);box-shadow:0 0 14px var(--cy);pointer-events:none}
@media(max-height:480px){#js{width:104px;height:104px}#jk{width:46px;height:46px;margin:-23px 0 0 -23px}#bf{width:72px!important;height:72px!important}#tc{padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}}
#tc button{pointer-events:auto;touch-action:none;background:rgba(0,255,225,.1);border:2px solid var(--cy);color:var(--cy);border-radius:12px;font-size:20px;box-shadow:0 0 10px rgba(0,255,225,.5)}
#tc button:active{background:rgba(0,255,225,.35)}
#bu{grid-area:u}#bl{grid-area:l}#br{grid-area:r}#bd{grid-area:d}
#bf{width:84px;height:84px;border-radius:50%!important;border-color:var(--mg)!important;color:var(--mg)!important;box-shadow:0 0 12px rgba(255,43,214,.6)!important;font-family:inherit;font-weight:700;font-size:15px!important}
button:focus-visible{outline:2px solid var(--ye);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
<div id="hud"><span>Can <b id="li">3</b></span><span>Xal <b id="sc">0</b></span><span>Rekord <b id="lv">0</b></span></div>
<div id="ov"><h1 id="ot">Neon Tank 1990</h1><p id="op"></p></div>
<div id="tc"><div id="js" aria-label="Joystik"><div id="jk"></div></div><button id="bf">Atəş</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id);
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
$('app').prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x05010f);S.fog=new T.Fog(0x05010f,45,100);
const cam=new T.PerspectiveCamera(38,1,.1,200);
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;const H=Math.max(31,31/cam.aspect),d=H*1.4,a=1.1;cam.position.set(13,Math.sin(a)*d,13.5+Math.cos(a)*d);cam.lookAt(13,0,13.5);cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

/* helpers */
const gc={},mc={},lc={};
const mat=c=>mc[c]||(mc[c]=new T.MeshBasicMaterial({color:c}));
const lm=c=>lc[c]||(lc[c]=new T.LineBasicMaterial({color:c}));
function bx(w,h,d,f,l){const k=w+'_'+h+'_'+d;let g=gc[k];if(!g){const b=new T.BoxGeometry(w,h,d);g=gc[k]={b,e:new T.EdgesGeometry(b)}}
const m=new T.Mesh(g.b,mat(f));m.add(new T.LineSegments(g.e,lm(l)));return m}
let AC;function beep(f,d=.08,t='square',v=.04){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* static scene: floor, grid, neon frame */
const fl=new T.Mesh(new T.PlaneGeometry(26,26).rotateX(-Math.PI/2),mat(0x070217));fl.position.set(13,0,13);S.add(fl);
const gr=new T.GridHelper(26,13,0x4a1a9a,0x2a0e66);gr.position.set(13,.01,13);S.add(gr);
[[26,0xff2bd6],[26.4,0x00ffe1]].forEach(([s,c])=>{const f=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(s,.6,s)),lm(c));f.position.set(13,.3,13);S.add(f)});

/* levels: 13x13 blocks. B brick, S steel, W water */
const LV=[
"............./.B.B.B.B.B.B./.B.B.B.B.B.B./.B.B.BSB.B.B./.B.B.B.B.B.B./......B....../BB.BB...BB.BB/............./.B.B.B.B.B.B./.B.B.B.B.B.B./.B...B.B...B./............./.............",
"............./.BB.S...S.BB./.BB.S.B.S.BB./.BB...B...BB./WW..BBBBB..WW/WW.........WW/..BB.SSS.BB.../..BB.....BB.../S...BB.BB...S/S.B.......B.S/..B.BB.BB.B.../............./.............",
"............./.S.B.....B.S./.S.B.BBB.B.S./.....B.B...../BB.........BB/WWWW.BBB.WWWW/WWWW.....WWWW/....B.S.B..../.BB.B...B.BB./.BB.......BB./.BB.BB.BB.BB./............./.............",
"............./BBB.BBBBB.BBB/B...........B/B.SS.BBB.SS.B/B.....B.....B/..BB..B..BB../WW..B...B..WW/..BB.SSS.BB.../B....B.B....B/B.BB.....BB.B/..S..BBB..S.../............./.............",
"............./.SBSB.B.BSBS./.B.........B./.B.SSSSSSS.B./.B.B.....B.B./...B.WWW.B.../WW.B.....B.WW/BB.BB.S.BB.BB/...B.....B.../.SS.BB.BB.SS./.B...B.B...B./............./............."
].map(s=>s.split('/'));
const DX=[0,1,0,-1],DZ=[-1,0,1,0];
let LG,g,cm,tanks,bullets,pts,P,baseM,baseDead,lvl=0,lives=3,score=0,queue=0,sp=0,respT=0,state='menu',ssn=0;

function cell(i,j,t){g[j][i]=t;let m;
if(t==1){m=bx(.94,.9,.94,0x2a1000,0xff7a1a);m.position.set(i+.5,.45,j+.5)}
else if(t==2){m=bx(.96,1.1,.96,0x0b1f33,0xbfeaff);m.position.set(i+.5,.55,j+.5)}
else{m=bx(1,.15,1,0x001a55,0x2f7bff);m.position.set(i+.5,.08,j+.5)}
LG.add(m);cm[j][i]=m}
function put(c,r,t){for(let a=0;a<2;a++)for(let b=0;b<2;b++){const i=c*2+a,j=r*2+b;if(cm[j][i]){LG.remove(cm[j][i]);cm[j][i]=null;g[j][i]=0}cell(i,j,t)}}
function build(n){if(LG)S.remove(LG);LG=new T.Group();S.add(LG);
g=[...Array(26)].map(()=>Array(26).fill(0));cm=[...Array(26)].map(()=>Array(26).fill(null));
tanks=[];bullets=[];pts=[];baseDead=false;
LV[n].forEach((row,r)=>[...row].forEach((ch,c)=>{const t={B:1,S:2,W:3}[ch];if(t)put(c,r,t)}));
[[5,12],[5,11],[6,11],[7,11],[7,12]].forEach(([c,r])=>put(c,r,1));
for(let j=24;j<26;j++)for(let i=12;i<14;i++)g[j][i]=9;
baseM=new T.Group();const pd=bx(1.7,.3,1.7,0x332a00,0xffd400);pd.position.y=.15;baseM.add(pd);
const oc=new T.Mesh(new T.OctahedronGeometry(.75),new T.MeshBasicMaterial({color:0xffd400,wireframe:true}));oc.position.y=1.1;oc.name='o';baseM.add(oc);
baseM.position.set(13,0,25);LG.add(baseM)}

/* tanks */
function tcol(t){if(t.isP)return[0x003a36,0x00ffe1];if(t.type=='fast')return[0x3a3400,0xffe600];if(t.type=='armor')return[0x14141f,[0,0xff3b3b,0xff9d2b,0xe8f0ff][t.hp]];return[0x3a0033,0xff2bd6]}
function paint(t){const[f,l]=tcol(t);t.parts.forEach(m=>{m.material=mat(f);m.children[0].material=lm(l)})}
function mkTank(t){const gp=new T.Group(),parts=[];
[[1.3,.5,1.5,0,.45,0],[.4,.5,1.9,-.85,.35,0],[.4,.5,1.9,.85,.35,0],[.8,.4,.8,0,.9,.1],[.22,.22,1.1,0,.92,-.9]].forEach(a=>{const m=bx(a[0],a[1],a[2],0,0);m.position.set(a[3],a[4],a[5]);gp.add(m);parts.push(m)});
t.g=gp;t.parts=parts;t.alive=true;t.bullet=null;t.spawn=0;paint(t);gp.rotation.y=-t.dir*Math.PI/2;gp.position.set(t.x+1,0,t.z+1);gp.scale.setScalar(.2);LG.add(gp);tanks.push(t);return t}
function can(t,nx,nz){if(nx<-.001||nz<-.001||nx>24.001||nz>24.001)return false;
const i0=Math.floor(nx+.01),i1=Math.floor(nx+1.99),j0=Math.floor(nz+.01),j1=Math.floor(nz+1.99);
for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)if(g[j][i])return false;
for(const o of tanks)if(o!==t&&o.alive&&Math.abs(o.x-nx)<2&&Math.abs(o.z-nz)<2)return false;return true}
function mv(t,d,dt){
if(d!=t.dir){t.dir=d;if(d%2){const z=Math.round(t.z/2)*2;if(can(t,t.x,z))t.z=z}else{const x=Math.round(t.x/2)*2;if(can(t,x,t.z))t.x=x}t.g.rotation.y=-d*Math.PI/2}
let s=t.speed*dt,m=false;
while(s>1e-4){const k=Math.min(.1,s);if(can(t,t.x+DX[d]*k,t.z+DZ[d]*k)){t.x+=DX[d]*k;t.z+=DZ[d]*k;m=true;s-=k}else break}
t.g.position.set(t.x+1,0,t.z+1);return m}
function spawnP(){P=mkTank({isP:true,x:8,z:24,dir:0,hp:1,speed:5.5,inv:2.5})}
let sidx=0;
function spawnE(){const x=[0,12,24][sidx++%3];if(!can(null,x,0))return false;
const r=Math.random(),a=.05+.06*lvl,f=.15+.04*lvl,type=r<a?'armor':r<a+f?'fast':'basic';
mkTank({isP:false,type,x,z:0,dir:2,hp:type=='armor'?3:1,speed:type=='fast'?6:type=='armor'?3:3.6,tt:1,ft:1});queue--;return true}

/* bullets, particles */
const SG=new T.SphereGeometry(.22,8,8),HG=new T.SphereGeometry(.5,8,8);
const hP=new T.MeshBasicMaterial({color:0x00ffe1,transparent:true,opacity:.28}),hE=new T.MeshBasicMaterial({color:0xff2bd6,transparent:true,opacity:.28});
function fire(t){const m=new T.Mesh(SG,mat(t.isP?0xffffff:0xffb3f0));m.add(new T.Mesh(HG,t.isP?hP:hE));
const b={x:t.x+1+DX[t.dir]*1.1,z:t.z+1+DZ[t.dir]*1.1,dx:DX[t.dir],dz:DZ[t.dir],spd:t.isP?14:t.type=='fast'?12:9,own:t,m};
m.position.set(b.x,.8,b.z);LG.add(m);t.bullet=b;bullets.push(b);beep(t.isP?700:300,.06)}
function dropB(b){b.dead=1;LG.remove(b.m);if(b.own.bullet===b)b.own.bullet=null}
const PG=new T.BoxGeometry(.28,.28,.28);
function boom(x,z,c,n){for(let k=0;k<n;k++){const m=new T.Mesh(PG,mat(c));m.position.set(x,.6,z);LG.add(m);pts.push({m,vx:(Math.random()-.5)*8,vy:Math.random()*7+2,vz:(Math.random()-.5)*8,l:.6})}}
function kill(x,y){LG.remove(cm[y][x]);cm[y][x]=null;g[y][x]=0}
function baseDie(){if(baseDead)return;baseDead=true;boom(13,25,0xffd400,30);beep(80,.5,'sawtooth',.08);baseM.scale.y=.25;baseM.getObjectByName('o').material=new T.MeshBasicMaterial({color:0xff3b3b,wireframe:true});setTimeout(over,1200)}
function killT(t){t.alive=false;LG.remove(t.g);boom(t.x+1,t.z+1,tcol(t)[1],16);beep(90,.3,'sawtooth',.07);
if(t.isP){lives--;respT=1.3;if(lives<=0)setTimeout(over,1000)}else score+=t.type=='armor'?300:t.type=='fast'?200:100}
function hit(b){
if(b.x<0||b.z<0||b.x>=26||b.z>=26){boom(Math.min(25.9,Math.max(0,b.x)),Math.min(25.9,Math.max(0,b.z)),0xffffff,3);return true}
const i=b.x|0,j=b.z|0,c=g[j][i];
if(c==1){(b.dx?[[i,j],[i,j^1]]:[[i,j],[i^1,j]]).forEach(([x,y])=>g[y][x]==1&&kill(x,y));boom(b.x,b.z,0xff7a1a,5);beep(130,.05);return true}
if(c==2){boom(b.x,b.z,0xbfeaff,3);beep(500,.04,'triangle');return true}
if(c==9){baseDie();return true}
for(const t of tanks){if(!t.alive||t.isP==b.own.isP)continue;
if(b.x>t.x&&b.x<t.x+2&&b.z>t.z&&b.z<t.z+2){if(t.isP){if(t.inv<=0)killT(t)}else{t.hp--;if(t.hp<=0)killT(t);else{paint(t);beep(220,.06)}}return true}}
for(const o of bullets)if(o!==b&&!o.dead&&o.own.isP!=b.own.isP&&Math.abs(o.x-b.x)<.6&&Math.abs(o.z-b.z)<.6){dropB(o);return true}
return false}

/* flow */
const ov=$('ov');
function show(t,p){$('ot').textContent=t;$('op').innerHTML=p;ov.classList.remove('h')}
function hide(){ov.classList.add('h')}
function startLevel(){build(1);queue=Infinity;sp=.5;state='intro';spawnP();const id=++ssn;
show('Sonsuz rejim','Düşmənlər dayanmadan gəlir.<br>Rekord: '+best+' xal');setTimeout(()=>{if(id==ssn&&state=='intro'){hide();state='play'}},1500)}
function newGame(){lvl=0;lives=3;score=0;startLevel()}
let best=+(function(){try{return localStorage.getItem('nt90')}catch(e){}})()||0;
function over(){if(state=='over'||state=='win')return;state='over';const nb=score>best;if(nb){best=score;try{localStorage.setItem('nt90',best)}catch(e){}}show('Oyun bitdi','Xalın: '+score+(nb?' — yeni rekord!':'')+'<br>Rekord: '+best+'<br>Yenidən başlamaq üçün Enter və ya toxun')}
function act(){try{AC&&AC.resume()}catch(e){}if(state=='menu'||state=='over'||state=='win')newGame()}
function update(dt){
tanks=tanks.filter(t=>t.alive);lvl=Math.min(8,score/1200|0);
if(P&&P.alive){if(stack.length)mv(P,stack[stack.length-1],dt);if(fireK&&!P.bullet)fire(P);P.inv-=dt;P.g.visible=P.inv<=0||Math.floor(P.inv*12)%2==0}
else if(lives>0){respT-=dt;if(respT<=0&&!baseDead)spawnP()}
for(const e of tanks){e.spawn=Math.min(1,e.spawn+dt*2);e.g.scale.setScalar(.2+.8*e.spawn);
if(e.isP||e.spawn<1)continue;
e.tt-=dt;e.ft-=dt;const m=mv(e,e.dir,dt);
if(!m||e.tt<=0){const r=Math.random();mv(e,r<.4?2:r<.55?(e.x<12?1:3):Math.floor(Math.random()*4),0);e.tt=1+Math.random()*2.5}
if(e.ft<=0&&!e.bullet){fire(e);e.ft=.6+Math.random()*(e.type=='fast'?1:2)}}
sp-=dt;const ea=tanks.filter(t=>!t.isP).length;
if(sp<=0&&queue>0&&ea<3+(lvl>1)+(lvl>3)+(lvl>5)){if(spawnE())sp=Math.max(.9,2.2-lvl*.15);else sp=.5}
for(const b of bullets){if(b.dead)continue;let d=b.spd*dt,x=false;
while(d>0&&!x){const s=Math.min(.2,d);d-=s;b.x+=b.dx*s;b.z+=b.dz*s;x=hit(b)}
if(x)dropB(b);else b.m.position.set(b.x,.8,b.z)}
bullets=bullets.filter(b=>!b.dead);
if(queue==0&&!tanks.some(t=>!t.isP&&t.alive)&&state=='play'&&!baseDead){state='clear';const id=ssn;
setTimeout(()=>{if(id!=ssn)return;if(lvl==4){state='win';show('Qələbə!','Bütün 5 səviyyəni keçdin.<br>Xalın: '+score+'<br>Yenidən oynamaq üçün Enter və ya toxun')}else{lvl++;startLevel()}},1400)}}
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
if(state=='play')update(dt);
if(state=='intro'||state=='clear')for(const t of tanks){t.spawn=Math.min(1,t.spawn+dt*2);t.g.scale.setScalar(.2+.8*t.spawn)}
for(const p of pts){p.l-=dt;p.vy-=16*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.1,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.m.scale.setScalar(Math.max(.01,p.l/.6));if(p.l<=0)LG.remove(p.m)}
pts=pts.filter(p=>p.l>0);
if(baseM&&!baseDead){const o=baseM.getObjectByName('o');o.rotation.y+=dt*1.5}
$('lv').textContent=Math.max(best,score);$('li').textContent=Math.max(0,lives);$('sc').textContent=score;
R.render(S,cam)}

/* input */
const dm={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
let stack=[],fireK=false;
const press=d=>{stack=stack.filter(x=>x!=d);stack.push(d)},rel=d=>{stack=stack.filter(x=>x!=d)};
addEventListener('keydown',e=>{if(e.code in dm){e.preventDefault();press(dm[e.code])}else if(e.code=='Space'){e.preventDefault();fireK=true;act()}else if(e.code=='Enter')act()});
addEventListener('keyup',e=>{if(e.code in dm)rel(dm[e.code]);else if(e.code=='Space')fireK=false});
const js=$('js'),jk=$('jk');let jid=null,jdir=-1;
function jset(d){if(d===jdir)return;if(jdir>=0)rel(jdir);jdir=d;if(d>=0)press(d)}
function jmove(e){const r=js.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jk.style.transform='translate('+dx+'px,'+dy+'px)';if(l<m*.25)jset(-1);else jset(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))}
js.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;js.setPointerCapture(e.pointerId);jmove(e)});
js.addEventListener('pointermove',e=>{if(e.pointerId==jid)jmove(e)});
['pointerup','pointercancel'].forEach(n=>js.addEventListener(n,e=>{if(e.pointerId!=jid)return;jid=null;jk.style.transform='';jset(-1)}));
const bf=$('bf');bf.addEventListener('pointerdown',e=>{e.preventDefault();fireK=true;act()});['pointerup','pointerleave','pointercancel'].forEach(n=>bf.addEventListener(n,()=>fireK=false));
ov.addEventListener('click',act);

build(0);
show('Neon Tank 1990','Bazanı qoru və dayanmadan gələn tankları vur.<br>Hərəkət: ox düymələri və ya WASD · Atəş: boşluq<br><br>Başlamaq üçün Enter və ya toxun');
requestAnimationFrame(loop);
</script>
</body>
</html>
